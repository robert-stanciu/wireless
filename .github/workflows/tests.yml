name: tests

on:
  push:
    branches: [main, '1.x']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Laravel is resolved from the branch's own constraints: 1.x pulls Livewire 3, main pulls
      # Livewire 4. Nothing to pin here — a Laravel matrix would have to pick versions Composer
      # now refuses to install anyway (every published Laravel 11 release carries an advisory).
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

      - name: Check formatting
        run: vendor/bin/pint --test
