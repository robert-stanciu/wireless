name: tests

on:
  push:
    branches: [main, '1.x']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: [highest, lowest]

    name: PHP ${{ matrix.php }} · ${{ matrix.deps }} deps

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Livewire comes from the branch's own constraint: 1.x resolves Livewire 3, main Livewire 4.
      # The `lowest` leg is what proves the declared floors are real — every one of them.
      - name: Install dependencies
        run: >
          composer update --prefer-dist --no-interaction --no-progress
          ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run tests
        run: vendor/bin/pest

  lint:
    runs-on: ubuntu-latest

    name: lint

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # --strict catches the extra.laravel provider/alias typos a consumer would find for us
      - name: Validate composer.json
        run: composer validate --strict

      - name: Check formatting
        run: vendor/bin/pint --test
